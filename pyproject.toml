[project]
name = "audible-tui"
version = "0.1.0"
description = "A terminal UI for browsing, downloading, and playing your existing Audible library."
requires-python = ">=3.10"
dependencies = [
    "audible>=0.10.0",
    "textual>=0.60.0",
    "httpx>=0.27.0",
    "platformdirs>=4.0.0",
]

[project.scripts]
audible-tui = "audible_tui.app:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["audible_tui*"]
