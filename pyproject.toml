[project]
name = "voxcodex"
dynamic = ["version"]
description = "A terminal UI for browsing, downloading, and playing your existing Audible library."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "JC100" }]
keywords = ["audible", "audiobooks", "tui", "terminal", "textual"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    # audible: reaches into audible.aescipher.decrypt_voucher_from_licenserequest,
    # audible.client.raise_for_status, audible.exceptions.AudibleError (needs
    # >=0.11), and monkeypatches five private audible.login.check_for_*
    # functions -- all present in 0.11-0.12, none API-stable, so pin the minor
    # range. audible>=0.11 itself requires Python>=3.11, which is also why
    # this package no longer supports 3.10 (see CLAUDE.md / TODO.md history).
    "audible>=0.11,<0.13",
    # textual: App.theme / App.available_themes (used at startup) are the
    # theme system that landed in ~0.86; the old >=0.60 floor threw
    # AttributeError on launch.
    "textual>=0.86,<9",
    "httpx>=0.27,<1",
    "platformdirs>=4,<5",
]

[project.urls]
Repository = "https://github.com/JC100/voxcodex"
Issues = "https://github.com/JC100/voxcodex/issues"

[project.scripts]
voxcodex = "voxcodex.app:run"

[project.optional-dependencies]
test = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0"]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0", "ruff>=0.16,<1", "mypy>=2.0,<3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["voxcodex*"]

[tool.setuptools.package-data]
voxcodex = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "voxcodex.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "BLE", "SIM", "UP"]

[tool.mypy]
files = ["voxcodex"]
python_version = "3.11"
strict = true
